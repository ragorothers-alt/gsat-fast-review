<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <pattern id="notebook-grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 H 0 V 64" fill="none" stroke="#eadfca" stroke-width="1" opacity="0.4"/>
    </pattern>
  </defs>

  <g id="paper">
    <rect width="512" height="512" rx="112" fill="#fbf3e4"/>
    <rect width="512" height="512" rx="112" fill="url(#notebook-grid)"/>
  </g>

  <g id="foreground" stroke="#3b2a22" stroke-linecap="round" stroke-linejoin="round">
    <!-- Unequal ears and generous, asymmetric cheeks give the silhouette its pen-drawn character. -->
    <path id="cat-head" d="M 144 177
      C 132 159 120 116 126 87
      C 127 78 134 78 143 84
      C 169 98 190 119 205 140
      C 238 131 279 133 308 141
      C 324 118 350 96 377 84
      C 386 80 392 84 392 96
      C 393 124 386 155 377 174
      C 416 203 437 243 435 288
      C 433 364 360 414 259 418
      C 159 423 83 377 77 305
      C 71 249 95 203 144 177 Z"
      fill="#f5a65b" stroke-width="16"/>
    <!-- Selective heavier strokes suggest nib pressure without texture or doubled lines. -->
    <path d="M 435 288 C 433 364 360 414 259 418 C 159 423 83 377 77 305"
      fill="none" stroke-width="18"/>

    <g fill="#f7b5a8" stroke-width="7">
      <path d="M 141 115 Q 141 109 148 115
        Q 165 127 179 147 Q 162 148 151 159
        Q 143 139 141 115 Z"/>
      <path d="M 374 113 Q 376 108 377 117
        Q 377 140 366 157 Q 352 148 336 147
        Q 354 125 374 113 Z"/>
    </g>

    <!-- Three short, tapered forehead stripes; flat ink shapes remain crisp at favicon sizes. -->
    <g fill="#d9783a" stroke="none">
      <path d="M 206 157 C 199 157 197 163 200 170
        L 212 195 C 215 201 222 199 221 193
        L 216 165 C 215 159 212 157 206 157 Z"/>
      <path d="M 255 149 C 249 149 245 153 246 160
        L 250 191 C 251 198 260 198 261 191
        L 265 160 C 266 153 262 149 255 149 Z"/>
      <path d="M 305 158 C 299 156 294 160 292 166
        L 286 193 C 285 200 292 202 296 195
        L 311 171 C 315 165 312 160 305 158 Z"/>
    </g>

    <g fill="#f7a5a0" stroke="none">
      <path d="M 120 297 C 121 286 135 282 151 284
        C 169 285 179 292 178 301 C 177 312 162 316 147 314
        C 130 313 119 308 120 297 Z"/>
      <path d="M 332 295 C 333 285 346 281 362 283
        C 380 284 389 291 388 300 C 386 311 372 315 356 313
        C 340 312 330 305 332 295 Z"/>
    </g>

    <g fill="#3b2a22" stroke="none">
      <path d="M 213 261 C 214 271 208 281 197 281
        C 186 281 178 273 179 262 C 179 252 186 245 196 245
        C 206 244 212 251 213 261 Z"/>
      <path d="M 329 260 C 329 271 322 279 311 279
        C 301 279 294 272 294 262 C 293 251 301 243 311 243
        C 322 243 329 250 329 260 Z"/>
    </g>
    <g fill="#ffffff" stroke="none">
      <circle cx="191" cy="254" r="4.8"/>
      <circle cx="306" cy="252" r="4.8"/>
    </g>

    <path d="M 246 291 Q 255 288 264 291
      Q 269 292 265 297 L 259 304 Q 255 308 251 304
      L 244 297 Q 240 293 246 291 Z"
      fill="#f7b5a8" stroke-width="6"/>
    <g fill="none">
      <path d="M 255 307 C 255 318 253 328 243 332
        C 232 337 221 330 223 319" stroke-width="10"/>
      <path d="M 255 314 C 256 325 264 335 275 332
        C 284 330 289 324 286 317" stroke-width="10.5"/>
      <path d="M 134 286 Q 112 279 90 280" stroke-width="8"/>
      <path d="M 132 308 Q 108 310 87 319" stroke-width="9"/>
      <path d="M 375 284 Q 398 276 418 278" stroke-width="8.5"/>
      <path d="M 377 307 Q 401 310 420 318" stroke-width="8"/>
    </g>

    <!-- A compact outlined lightning badge overlaps the lower right cheek. -->
    <path id="quick-quiz-badge" d="M 399 331
      C 402 327 408 330 406 337 L 401 365 L 434 365
      C 441 365 443 371 438 376 L 380 438
      C 375 443 367 440 370 432 L 378 397 L 351 398
      C 344 398 342 392 347 386 Z"
      fill="#f2b632" stroke-width="13"/>
